version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: email-service-db
    environment:
      POSTGRES_USER: email
      POSTGRES_PASSWORD: email
      POSTGRES_DB: email_service
    ports:
      - "55433:5432"
    volumes:
      - email_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email -d email_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: email-service-redis
    ports:
      - "16380:6379"
    volumes:
      - email_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local email testing (Mailhog)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: email-service-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    logging:
      driver: none

  migrate:
    image: migrate/migrate:latest
    container_name: email-service-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://email:email@postgres:5432/email_service?sslmode=disable",
      "up"
    ]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: email-service-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    environment:
      ENV: development
      API_PORT: "8082"
      DATABASE_URL: postgres://email:email@postgres:5432/email_service?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-api-key
      # Use Mailhog for local testing
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: noreply@localhost
      SMTP_FROM_NAME: Email Service
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: email-service-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: development
      DATABASE_URL: postgres://email:email@postgres:5432/email_service?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: noreply@localhost
      SMTP_FROM_NAME: Email Service
    restart: unless-stopped

volumes:
  email_postgres_data:
  email_redis_data:
