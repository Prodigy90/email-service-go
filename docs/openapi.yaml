  /api/v1/campaigns/{tag}/stats:
    get:
      tags:
        - Campaigns
      summary: Get campaign stats
      description: Returns aggregate send/delivery stats for a campaign tag.
      operationId: getCampaignStats
      parameters:
        - name: tag
          in: path
          required: true
          description: Campaign tag identifier
          schema:
            type: string
          example: "camp_migration_w1"
      responses:
        '200':
          description: Campaign stats
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing campaign tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/campaigns/{tag}/bounced:
    get:
      tags:
        - Campaigns
      summary: Get bounced emails for campaign
      description: Returns email addresses from a campaign that bounced or received complaints.
      operationId: getCampaignBounced
      parameters:
        - name: tag
          in: path
          required: true
          description: Campaign tag identifier
          schema:
            type: string
          example: "camp_migration_w1"
      responses:
        '200':
          description: List of bounced email addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_tag:
                    type: string
                    example: "camp_migration_w1"
                  count:
                    type: integer
                    example: 5
                  addresses:
                    type: array
                    items:
                      type: string
                      format: email
                    example: ["bounced@example.com"]
        '400':
          description: Missing campaign tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/campaigns/{tag}/non-openers:
    get:
