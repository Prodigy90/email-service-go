# Sequences GA launch announcement (June 2026)
# sequences_launch — existing-user announcement: autoresponder -> Sequences

sequences_launch:
  subject: "Your auto-reply just grew up 🚀"
  preview_text: "The autoresponder could only fire once. Sequences runs the full conversation — and your old replies already moved over."
  body: |
    Hi {{.Name}},

    Quick one, and I think you'll like it.

    Your auto-reply used to do one thing: someone sends a keyword, WASBOT fires
    back a single reply, done. If they asked a follow-up while you were asleep,
    that lead went cold.

    That's over. Meet Sequences — your autoresponder, grown up. Now WASBOT runs
    the entire conversation for you:

      - A lead DMs your keyword
      - WASBOT greets them, then waits for their reply
      - It branches on what they say — clothes, accessories, whatever you set
      - Sends the right catalog, photo or video on the spot
      - Goes quiet for a few hours, then fires a follow-up on its own
      - And shows you who got it, who read it, and who's about to buy

    So a lead who lands at 2AM gets greeted, sent the catalog, nudged a few hours
    later, and closed — while you sleep. You wake up to "send me the payment
    link," not a cold DM you forgot to answer.

    Best part: you don't rebuild anything. Your existing auto-replies already
    moved over to Sequences automatically. Open WASBOT and you'll see them as
    flows you can now expand — add a wait, a branch, a follow-up.

    Build your first flow: https://www.wasbot.app/sequences
    See exactly how it works: https://www.wasbot.app/blog/sequences

    What's coming next
    We're already building the step after this: flows that don't just reply, but
    auto-save the contact, add them to your lists, and drop them into the right
    group. Your whole ad to DM to customer pipeline, hands-off.

    Tell us what to build
    What's working? What's missing? What flow do you wish WASBOT could run for you?
      - Join the community: https://chat.whatsapp.com/EoP7wlsiUe4CKKA5E6BXCY?mode=gi_t
      - Or just reply to this email — it comes straight to us.

    We read everything — and a lot of what we ship comes straight from these.

    Talk soon,
    The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account.
    Unsubscribe: {{.UnsubscribeURL}}
