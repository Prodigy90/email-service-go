# Re-engagement series step 0 (item 76, 2026-10-16). The re-engagement
# series (churned paid users) used to open with onboarding_day0, which since
# the 2026-10-12 welcome refresh reads as a first welcome. This is its own
# opener: the plan ended, the account is still here, what they got from
# WASBOT, how to come back. Steps 1-7 (reengage_day1..7) are its own come-back
# series: what WASBOT did for them, what stopped with the plan, how to turn
