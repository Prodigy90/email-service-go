# Re-engagement series step 0 (item 76, 2026-10-16). The re-engagement
# series (churned paid users) used to open with onboarding_day0, which since
# the 2026-10-12 welcome refresh reads as a first welcome. This is its own
# opener: the plan ended, the account is still here, what they got from
# WASBOT, how to come back. Steps 1-7 still reuse the trial templates.
# FOUNDER-REVIEW-GATED COPY: do not deploy before the founder has read it.

reengage_day0:
  subject: "Your WASBOT setup is still here{{if .FirstName}}, {{.FirstName}}{{end}}"
  description: "Re-engagement step 0 (churned paid users): plan ended, account kept, their numbers, how to come back. No trial, no code. Item 76, 2026-10-16."
  preview_text: "Nothing was deleted. Pick up where you stopped."
  body: |-
    Hi {{.Name}},

    Your WASBOT plan has ended, but your account is still here. Your lists, your auto-replies and your sequences are saved and waiting for you.

    {{if .HasActivity}}Here is what WASBOT did for you while you were with us:
    {{if .ContactsSaved}}- Saved {{num .ContactsSaved}} contacts for you
    {{end}}{{if .StatusesPosted}}- Posted {{num .StatusesPosted}} statuses{{if .StatusViews}}, seen {{num .StatusViews}} times{{end}}
    {{end}}{{if .GroupSends}}- Sent {{num .GroupSends}} group blasts
    {{end}}
    {{end}}Coming back takes two minutes:
    1. Pick your plan: {{.PricingURL}}
    2. Open your dashboard and check your WhatsApp is still linked: {{.DashboardURL}}

    Here is what is waiting for you:

    - Posts your status from the cloud, full quality, phone in your pocket
    - Saves everyone who messages you, so they can all see your status
    - Messages all your groups at once, and tags everyone
    - Broadcasts to your list, one personal message at a time
    - Replies for you while you sleep, and runs follow-up sequences
    - Shows you who actually sees your status
    - Posts to more than one WhatsApp number at once when you add numbers

    If something made you stop, I want to hear it. Reply to this email or message us on WhatsApp: https://wa.me/2349018943768?text=Hi%20Victor%2C%20my%20WASBOT%20plan%20ended%20and%20I%20have%20a%20question.

    Talk soon,
    Victor

    Tomorrow: how to get every new chat saved to your contacts, without typing a thing.
  html_body: |-
