    {{end}}{{if .StatusesPosted}}- Posted {{num .StatusesPosted}} statuses{{if .StatusViews}}, seen {{num .StatusViews}} times{{end}}
    {{end}}{{if .GroupSends}}- Sent {{num .GroupSends}} group blasts
    {{end}}
    {{end}}Coming back takes two minutes:
    1. Pick your plan: {{.BillingURL}}
    2. Link your WhatsApp again from your dashboard: {{.DashboardURL}}

    Here is what is waiting for you:

    - Posts your status from the cloud, full quality, phone in your pocket
    - Saves everyone who messages you to your contacts
    - Messages all your groups at once, and tags everyone
    - Broadcasts to your list, one personal message at a time
    - Replies for you while you sleep, and runs follow-up sequences
    - Shows you who actually sees your status
    - Posts to more than one WhatsApp number at once when you add numbers

