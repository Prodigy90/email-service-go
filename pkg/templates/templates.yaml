# =============================================================================
# migration_announcement — OVERRIDES built-in template from template.go
# =============================================================================
# First email in the legacy migration campaign. Explains WHY wasbot.ng is
# shutting down, what happens to Paystack subscriptions, tiered offers,
# and how to migrate.
#
# Variables:
#   {{.Name}}           - Recipient name
#   {{.DashboardURL}}   - Link to wasbot.app
#   {{.UnsubscribeURL}} - Unsubscribe link

migration_announcement:
  subject: "Important: wasbot.ng is shutting down March 31 — here's your migration offer"
  body: |
    Hi {{.Name}},

    We have some important news.

    wasbot.ng is shutting down on March 31, 2026.

    Why? Honestly — the old WASBOT was built on tech that kept breaking. Sessions dropping randomly, features that worked one day and didn't the next, impossible to add new things without something else falling apart. It couldn't scale and we got tired of patching it.

    So we rebuilt everything from scratch. New backend, new dashboard, new infrastructure. It's faster, more stable, and packed with features the old version could never support.

    Everything is now at www.wasbot.app

    See what's new: https://www.wasbot.app/#features

    WHAT HAPPENS TO YOUR PAYSTACK SUBSCRIPTION

    All existing Paystack plans on wasbot.ng will be cancelled. You will not be charged again on the old platform. No rollovers — the old subscriptions end with the old platform.

    YOUR MIGRATION OFFER

    Because you've been with us, here's what you get when you sign up on the new platform:

    - Ultimate Organizer: 30 days FREE Basic + 3 months 10% off
    - Efficiency Explorer: 14 days FREE Basic + 3 months 10% off
    - Essential Saver: 7 days FREE Basic + 3 months 10% off
    - Everyone else: 7-day free trial + one-time 10% off any plan

    Sign up with the same email you used on wasbot.ng and the offer applies automatically. No codes needed.

    HOW TO MIGRATE

    1. Go to https://www.wasbot.app
    2. Sign up with your wasbot.ng email
    3. Your offer is applied instantly
    4. Connect your WhatsApp — scan QR and you're live

    Deadline: March 31, 2026 — after that, wasbot.ng is gone permanently.

    Migrate now: {{.DashboardURL}}

    EARN WITH WASBOT

    Not ready to migrate? You can still earn. Refer friends and family to WASBOT and earn 20% commission on their first 3 months of any paid plan.

    Learn how it works: https://www.wasbot.app/blog/affiliate-program

    Questions? Just reply to this email.

    — The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account on wasbot.ng.
    Unsubscribe: {{.UnsubscribeURL}}
