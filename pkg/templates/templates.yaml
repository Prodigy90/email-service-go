# =============================================================================
# migration_announcement — OVERRIDES built-in template from template.go
# =============================================================================
# First email in the legacy migration campaign. Explains WHY wasbot.ng is
# shutting down, what happens to Paystack subscriptions, tiered offers,
# and how to migrate. Rewritten for maximum opens and hook retention.
# Lead paragraph answers the 3 core user questions immediately.
# Tiered migration offers auto-applied by email. CTA reframed as value claim.
# Affiliate section retained for non-migrators.
#
# Variables:
#   {{.Name}}           - Recipient name
#   {{.DashboardURL}}   - Link to wasbot.app
#   {{.UnsubscribeURL}} - Unsubscribe link

migration_announcement:
  subject: "Your WASBOT account is moving — here's what happens next"
  preview_text: "wasbot.ng closes March 31. Your new home is ready. Takes 2 minutes."
  body: |
    Hi {{.Name}},

    On March 31, 2026, wasbot.ng goes offline permanently — but this isn't the end.
    We rebuilt WASBOT from the ground up, and your new account is already waiting.
    This email tells you exactly what's changing, what you're getting for free,
    and how to be live again in under 2 minutes.

    -----------------------------------------------------------------------
    WASBOT.NG SHUTS DOWN MARCH 31, 2026
    -----------------------------------------------------------------------
    After this date the old platform is gone permanently.
    Everything you need is at www.wasbot.app

    The old WASBOT kept breaking — sessions dropped without warning, features
    stopped working overnight, and scaling was structurally impossible. We stopped
    patching it and rebuilt everything from scratch: new backend, new dashboard,
    new infrastructure.

    The new platform is faster, more stable, and supports features the old version
    couldn't. Think of this as your upgrade, not a migration.

    See everything that's new: https://www.wasbot.app/#features

    -----------------------------------------------------------------------
    WHAT HAPPENS TO YOUR PAYSTACK SUBSCRIPTION
    -----------------------------------------------------------------------
    All existing Paystack plans on wasbot.ng will be cancelled.
    You will NOT be charged again on the old platform.
    No rollovers — subscriptions end with the platform.
    You'll start fresh on wasbot.app.

    -----------------------------------------------------------------------
    WHAT YOU'RE GETTING ON THE NEW PLATFORM
    -----------------------------------------------------------------------

    {{if and .IsLegacyUser .LegacyEligible (.OfferFreeDays)}}YOUR PERSONAL MIGRATION OFFER

    As a {{.LegacyPlan}} subscriber, your paid subscription isn't just being
    cancelled — we're converting the remaining value into free time:

      → {{.OfferFreeDays}} days FREE on the Basic plan
      → {{.OfferDiscountPercent}}% off any paid plan for your next {{.OfferDiscountUses}} payments

    Sign up with your wasbot.ng email — your offer is detected and applied
    automatically. No codes, no support ticket needed.
    {{else if .IsLegacyUser}}YOUR MIGRATION OFFER

    Sign up and get a 7-day free trial on any plan{{if .OfferDiscountPercent}}, plus a
    one-time {{.OfferDiscountPercent}}% discount on your first payment{{end}}.
    No credit card required. No commitment, no charge.
    {{else}}IF YOU HAD AN ACTIVE SUBSCRIPTION ON WASBOT.NG

