    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>Migration reminder</title>
      <meta name="color-scheme" content="light dark">
      <meta name="supported-color-schemes" content="light dark">
      <!--[if mso]>
      <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
      <![endif]-->
      <style>
        :root { color-scheme: light dark; }
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6; }
        a { color: {{.Branding.PrimaryColor}}; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media only screen and (max-width: 620px) {
          .container { width: 100% !important; padding: 0 !important; }
          .content { padding: 24px 20px !important; }
          .header { padding: 24px 20px !important; }
          .footer-content { padding: 24px 20px !important; }
        }
        @media (prefers-color-scheme: dark) {
          .header-company-name { color: #ffffff !important; }
        }
      </style>
    </head>
    <body style="background-color: #f3f4f6; margin: 0; padding: 0;">
      <div style="display: none; max-height: 0; overflow: hidden;">
        Your migration offer is still active — wasbot.ng shuts down March 31
        &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
      </div>
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f3f4f6;">
        <tr>
          <td style="padding: 40px 20px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" align="center" class="container" style="max-width: 600px; margin: 0 auto;">

              <!-- Header -->
              <tr>
                <td class="header" style="background: linear-gradient(135deg, #111827 0%, #1f2937 100%); padding: 32px 40px; border-radius: 16px 16px 0 0;">
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td style="vertical-align: middle; padding-right: 14px;">
                        <div style="width: 44px; height: 44px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); border-radius: 12px; text-align: center; line-height: 44px;">
                          {{.Branding.LogoContent}}
                        </div>
                      </td>
                      <td style="vertical-align: middle;">
                        <span class="header-company-name" style="color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: 1px;">{{.Branding.CompanyName}}</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Body -->
              <tr>
                <td class="content" style="background-color: #ffffff; padding: 40px; border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;">
                  <h1 style="margin: 0 0 24px 0; font-size: 26px; font-weight: 700; color: #111827; line-height: 1.3;">Friendly reminder</h1>

                  <div style="font-size: 16px; line-height: 1.7; color: #4b5563;">
                    <p style="margin: 0 0 20px 0;">Hi {{.Name}},</p>

                    <!-- Urgency banner -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 20px; border-radius: 0 12px 12px 0;">
                          <p style="margin: 0 0 4px; color: #991b1b; font-size: 15px; font-weight: 700;">wasbot.ng shuts down March 31, 2026</p>
                          <p style="margin: 0; color: #b91c1c; font-size: 14px;">Your Paystack subscription will be cancelled. No more charges on the old platform.</p>
                        </td>
                      </tr>
                    </table>

                    <p style="margin: 0 0 20px 0;">Your migration offer is still active. Sign up with your wasbot.ng email and it applies automatically:</p>

                    {{- if and .IsLegacyUser .LegacyEligible (.OfferFreeDays)}}
                    <!-- Personalized offer -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #f0fdf4; border: 2px solid {{.Branding.PrimaryColor}}; border-radius: 12px; padding: 18px;">
                          <div style="color: #166534; font-weight: 800; font-size: 20px; margin-bottom: 4px;">{{.OfferFreeDays}} days free on Basic</div>
                          <div style="color: #166534; font-size: 14px; margin-bottom: 10px;">
                            then <strong>{{.OfferDiscountPercent}}% off</strong> any paid plan for your next {{.OfferDiscountUses}} payments
                          </div>
                          <div style="color: #166534; font-size: 12px; font-weight: 600;">
                            &#10003; Based on your {{.LegacyPlan}} subscription
                          </div>
                        </td>
                      </tr>
                    </table>
                    {{- else if .IsLegacyUser}}
                    <!-- Non-active legacy user offer -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #eff6ff; border-radius: 12px; padding: 16px;">
                          <div style="color: #1e3a5f; font-size: 14px;">
                            <strong>7-day free trial</strong> on any plan{{if .OfferDiscountPercent}} + <strong>one-time {{.OfferDiscountPercent}}% off</strong>{{end}}
                          </div>
                        </td>
                      </tr>
                    </table>
                    {{- else}}
                    <!-- Fallback: static list -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #f0fdf4; border-radius: 12px; padding: 16px;">
                          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr><td style="padding: 6px 0; color: #166534; font-size: 14px;"><strong>Ultimate Organizer:</strong> 30 days FREE + 3mo 10% off</td></tr>
                            <tr><td style="padding: 6px 0; color: #166534; font-size: 14px;"><strong>Efficiency Explorer:</strong> 14 days FREE + 3mo 10% off</td></tr>
                            <tr><td style="padding: 6px 0; color: #166534; font-size: 14px;"><strong>Essential Saver:</strong> 7 days FREE + 3mo 10% off</td></tr>
                            <tr><td style="padding: 6px 0; color: #166534; font-size: 14px;"><strong>Everyone else:</strong> 7-day trial + 10% off</td></tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                    {{- end}}

                    <!-- CTA -->
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto 28px;">
                      <tr>
                        <td style="border-radius: 8px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);">
                          <a href="{{.DashboardURL}}" target="_blank" style="display: inline-block; padding: 16px 40px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none;">
                            Migrate Now &mdash; 2 Minutes
                          </a>
                        </td>
                      </tr>
                    </table>

                    <p style="margin: 0 0 8px 0; font-size: 14px; color: #6b7280;">After March 31, the old platform is gone permanently.</p>
                    <p style="margin: 16px 0 0 0; font-size: 14px; color: #9ca3af;">&mdash; <strong>The WASBOT Team</strong></p>
                  </div>
                </td>
              </tr>

              <!-- Footer -->
              <tr>
                <td style="background-color: #f9fafb; padding: 0; border-radius: 0 0 16px 16px; border: 1px solid #e5e7eb; border-top: none;">
                  <div style="height: 1px; background: linear-gradient(to right, transparent, #e5e7eb, transparent); margin: 0 40px;"></div>
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                    <tr>
                      <td class="footer-content" style="padding: 32px 40px; text-align: center;">
                        <p style="margin: 0 0 20px 0; font-size: 14px; color: #6b7280; line-height: 1.6;">
                          Need help? Simply reply to this email and we'll get back to you.
                        </p>
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin-bottom: 20px;">
                          <tr>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialTwitter}}" style="display: inline-block;">
                                <img src="{{.Branding.IconTwitterURL}}" alt="X" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialInstagram}}" style="display: inline-block;">
                                <img src="{{.Branding.IconInstagramURL}}" alt="Instagram" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialYouTube}}" style="display: inline-block;">
                                <img src="{{.Branding.IconYouTubeURL}}" alt="YouTube" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                          </tr>
                        </table>
                        <p style="margin: 0; font-size: 13px; color: #9ca3af; line-height: 1.5;">
                          {{.Branding.CompanyName}} Technologies<br>Lagos, Nigeria
                        </p>
                        <p style="margin: 16px 0 0 0; font-size: 12px; color: #9ca3af;">
                          &copy; {{.Branding.Year}} {{.Branding.CompanyName}}. All rights reserved.
                        </p>
                        {{if .UnsubscribeURL}}
                        <p style="margin: 12px 0 0 0; font-size: 12px; color: #9ca3af;">
                          <a href="{{.UnsubscribeURL}}" style="color: #9ca3af; text-decoration: underline;">Unsubscribe</a> from these emails.
                        </p>
                        {{end}}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
          </td>
        </tr>
      </table>
    </body>
    </html>
  description: "Migration follow-up — OVERRIDES built-in. Reminder with offers and deadline"
