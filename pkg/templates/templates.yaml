                      </td>
                      <td style="vertical-align: middle;">
                        <span style="color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: 1px;">{{.Branding.CompanyName}}</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Body -->
              <tr>
                <td class="content" style="background-color: #ffffff; padding: 40px; border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;">
                  <h1 style="margin: 0 0 24px 0; font-size: 26px; font-weight: 700; color: #111827; line-height: 1.3;">Important update</h1>

                  <div style="font-size: 16px; line-height: 1.7; color: #4b5563;">
                    <p style="margin: 0 0 20px 0;">Hi {{.Name}},</p>

                    <!-- Shutdown notice -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 20px; border-radius: 0 12px 12px 0;">
                          <p style="margin: 0 0 4px; color: #991b1b; font-size: 16px; font-weight: 700;">wasbot.ng is shutting down on March 31, 2026</p>
                          <p style="margin: 0; color: #b91c1c; font-size: 14px; line-height: 1.5;">After this date, the old platform will be permanently offline.</p>
                        </td>
                      </tr>
                    </table>

                    <p style="margin: 0 0 16px 0;">Honestly &mdash; the old WASBOT was built on tech that kept breaking. Sessions dropping randomly, features that worked one day and didn't the next. It couldn't scale and we got tired of patching it.</p>
                    <p style="margin: 0 0 24px 0;">So we rebuilt everything from scratch. New backend, new dashboard, new infrastructure. It's faster, more stable, and packed with features the old version could never support.</p>

                    <p style="margin: 0 0 24px 0; text-align: center;">
                      <a href="https://www.wasbot.app/#features" style="color: {{.Branding.PrimaryColor}}; font-size: 15px; font-weight: 600;">See all the new features &rarr;</a>
                    </p>

                    <!-- Paystack notice -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #fef3c7; border-left: 4px solid #f59e0b; padding: 20px; border-radius: 0 12px 12px 0;">
                          <p style="margin: 0 0 4px; color: #92400e; font-size: 15px; font-weight: 700;">What happens to your Paystack subscription</p>
                          <p style="margin: 0; color: #a16207; font-size: 14px; line-height: 1.5;">All existing Paystack plans on wasbot.ng will be cancelled. You will <strong>not</strong> be charged again on the old platform. No rollovers &mdash; the old subscriptions end with the old platform.</p>
                        </td>
                      </tr>
                    </table>

                    <!-- Offers -->
                    <p style="margin: 0 0 16px 0; font-weight: 700; color: #111827;">Your migration offer</p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #f0fdf4; border: 2px solid {{.Branding.PrimaryColor}}; border-radius: 12px; padding: 20px;">
                          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr><td style="padding: 8px 0; color: #166534; font-size: 14px; line-height: 1.5;"><strong>Ultimate Organizer:</strong> 30 days FREE Basic + 3 months 10% off</td></tr>
                            <tr><td style="padding: 8px 0; color: #166534; font-size: 14px; line-height: 1.5; border-top: 1px solid #dcfce7;"><strong>Efficiency Explorer:</strong> 14 days FREE Basic + 3 months 10% off</td></tr>
                            <tr><td style="padding: 8px 0; color: #166534; font-size: 14px; line-height: 1.5; border-top: 1px solid #dcfce7;"><strong>Essential Saver:</strong> 7 days FREE Basic + 3 months 10% off</td></tr>
                            <tr><td style="padding: 8px 0; color: #166534; font-size: 14px; line-height: 1.5; border-top: 1px solid #dcfce7;"><strong>Everyone else:</strong> 7-day free trial + one-time 10% off any plan</td></tr>
                          </table>
                          <p style="margin: 12px 0 0; color: {{.Branding.PrimaryColor}}; font-size: 13px;">Sign up with your wasbot.ng email &mdash; offer applies automatically. No codes.</p>
                        </td>
                      </tr>
                    </table>

                    <!-- How to migrate -->
                    <p style="margin: 0 0 12px 0; font-weight: 700; color: #111827;">How to migrate (2 minutes)</p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #eff6ff; border-radius: 12px; margin-bottom: 24px;">
                      <tr>
                        <td style="padding: 20px;">
                          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                            <tr>
                              <td style="padding: 8px 0;">
                                <span style="background: #3b82f6; color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; font-weight: 600;">1</span>
                                <span style="margin-left: 12px; color: #374151;">Go to <a href="https://www.wasbot.app" style="color: {{.Branding.PrimaryColor}}; font-weight: 600;">wasbot.app</a></span>
                              </td>
                            </tr>
                            <tr>
                              <td style="padding: 8px 0;">
                                <span style="background: #3b82f6; color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; font-weight: 600;">2</span>
                                <span style="margin-left: 12px; color: #374151;">Sign up with your wasbot.ng email</span>
                              </td>
                            </tr>
                            <tr>
                              <td style="padding: 8px 0;">
                                <span style="background: #3b82f6; color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; font-weight: 600;">3</span>
                                <span style="margin-left: 12px; color: #374151;">Your offer is applied instantly</span>
                              </td>
                            </tr>
                            <tr>
                              <td style="padding: 8px 0;">
                                <span style="background: #3b82f6; color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; font-weight: 600;">4</span>
                                <span style="margin-left: 12px; color: #374151;">Connect your WhatsApp &mdash; scan QR and you're live</span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>

                    <!-- CTA -->
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto 28px;">
                      <tr>
                        <td style="border-radius: 8px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);">
                          <a href="{{.DashboardURL}}" target="_blank" style="display: inline-block; padding: 16px 40px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none;">
                            Migrate Now &mdash; It's Free
                          </a>
                        </td>
                      </tr>
                    </table>

                    <!-- Affiliate CTA -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #faf5ff; border-left: 4px solid #8b5cf6; padding: 20px; border-radius: 0 12px 12px 0;">
                          <p style="margin: 0 0 6px; color: #5b21b6; font-size: 15px; font-weight: 700;">Earn with WASBOT</p>
                          <p style="margin: 0 0 12px; color: #6d28d9; font-size: 14px; line-height: 1.5;">Not ready to migrate? You can still earn. Refer friends and family to WASBOT and earn <strong>20% commission</strong> on their first 3 months of any paid plan.</p>
                          <a href="https://www.wasbot.app/blog/affiliate-program" style="color: #7c3aed; font-size: 14px; font-weight: 600; text-decoration: underline;">Learn how it works &rarr;</a>
                        </td>
                      </tr>
                    </table>

                    <p style="margin: 0 0 8px 0; font-size: 14px; color: #6b7280;">Questions? Just reply to this email.</p>
                    <p style="margin: 0; font-size: 14px; color: #9ca3af;">&mdash; <strong>The WASBOT Team</strong></p>
                  </div>
                </td>
              </tr>

              <!-- Footer -->
              <tr>
                <td style="background-color: #f9fafb; padding: 0; border-radius: 0 0 16px 16px; border: 1px solid #e5e7eb; border-top: none;">
                  <div style="height: 1px; background: linear-gradient(to right, transparent, #e5e7eb, transparent); margin: 0 40px;"></div>
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
