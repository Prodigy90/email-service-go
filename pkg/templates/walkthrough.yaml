# The /walkthrough link email (item 136): one send to a lead's address the
# first time it is entered on the walkthrough page. The lead asked for it
# ("We'll email you the link so you can finish it later"), so the backend sends
# it ungated. No name is known, so no {{.Name}}.
#
# Data: WatchURL, HelpURL (both defaulted by the backend), PreviewText optional.
vsl_walkthrough_link:
  subject: "How to automate your WhatsApp (your 16-minute video)"
  preview_text: "The video you asked for. Watch it when you're ready."
  body: |
    Hi there,

    Here's the video you asked for, on how to automate your WhatsApp. It shows how sellers get every contact saved, post status to everyone, send to all their groups at once and reply at 1am without touching their phone.

    Watch it when you're ready, it picks up where you stopped on the same device.

    Watch the video: {{.WatchURL}}

    Questions? Reply to this email or message us at wasbot.app/wa: {{.HelpURL}}

    Victor, founder of WASBOT

    ---
    You're getting this because you asked for the free WhatsApp automation video at wasbot.app.
