# Paid onboarding series (founder decision 2026-10-12: payers get onboarding
# too, not only a receipt). Sent by wasbot-backend's sequence cron to a
# first-time payer who never had the trial series (sequence_type
# paid_onboarding). Step 0 is the first payment's receipt
# (payment_success_onetime with FirstPayment set), so this file starts at 1.
#
# Paid-safe on purpose: no trial countdown, no discount code, no upgrade
# offer, no plan limits. One template per day with no never-linked fork; a
# payer who never linked gets the NeedsLink line instead. Every email but the
# last ends with a "Tomorrow: ..." line naming the next day's topic.

onboarding_paid_day1:
  subject: "Never save a contact by hand again"
  description: "Paid series step 1 (first-time payers who never had the trial series): contacts saved for you. No trial, code or upgrade copy. Welcome refresh 2026-10-12."
  body: |-
    Hi {{.Name}},

    Every new person who messages you can be saved to your contacts for you. Name, number, done. No more typing "customer 234" at midnight.

    {{if .ContactsSaved}}WASBOT has already saved {{num .ContactsSaved}} contacts for you. Everyone who saves your number back can see your status.{{else}}Set up contact saving once and watch your list grow on its own.{{end}}

    Why it matters: people who are not saved usually never see your status. Every contact WASBOT saves can see your status once they save your number back.

    Watch how (3 min): https://www.wasbot.app/watch/contacts
    Set it up: {{if .ContactsURL}}{{.ContactsURL}}{{else}}{{.DashboardURL}}{{end}}

    {{if .NeedsLink}}Not linked yet? Link your WhatsApp first, it takes about a minute: {{.ConnectURL}}

    {{end}}Need a hand? Message us on WhatsApp and a representative will respond as soon as possible: https://wa.me/2349018943768?text=Hi%20Victor%2C%20I%20just%20joined%20WASBOT%20and%20need%20help.

    Talk soon,
    The WASBOT Team

    Tomorrow: how to post your status from the cloud, with your phone in your pocket.
  html_body: |-
