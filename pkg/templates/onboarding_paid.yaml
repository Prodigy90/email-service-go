        }
      </style>
    </head>
    <body style="background-color: #f3f4f6; margin: 0; padding: 0;">
      <!-- Preview text -->
      <div style="display: none; max-height: 0; overflow: hidden;">
        {{if .PreviewText}}{{.PreviewText}}{{else}}Help, videos and the community, all in one place.{{end}}
        &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
      </div>

      <!-- Email wrapper -->
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f3f4f6;">
        <tr>
          <td style="padding: 40px 20px;">
            <!-- Main container -->
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" align="center" class="container" style="max-width: 600px; margin: 0 auto;">

              <!-- Header with logo -->
              <tr>
                <td class="header" style="background: linear-gradient(135deg, #111827 0%, #1f2937 100%); padding: 32px 40px; border-radius: 16px 16px 0 0;">
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                    <tr>
                      <td>
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                          <tr>
                            <td style="vertical-align: middle; padding-right: 14px;">
                              <div style="width: 44px; height: 44px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); border-radius: 12px; text-align: center; line-height: 44px;">
                                {{.Branding.LogoContent}}
                              </div>
                            </td>
                            <td style="vertical-align: middle;">
                              <span class="header-company-name" style="color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: 1px;">{{.Branding.CompanyName}}</span>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Main content -->
              <tr>
                <td class="content" style="background-color: #ffffff; padding: 40px; border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;">
                  <h1 style="margin: 0 0 24px 0; font-size: 26px; font-weight: 700; color: #111827; line-height: 1.3;">One week in</h1>

                  <div style="font-size: 16px; line-height: 1.7; color: #4b5563;">
    <p style="margin: 0 0 20px 0;">Hi {{.Name}},</p>

    {{if .HasActivity}}
    <p style="margin: 0 0 20px 0;">You've had WASBOT for a week. Here's what it has done for you so far:</p>

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f0fdf4; border-radius: 12px; margin-bottom: 24px;">
      <tr>
        <td style="padding: 20px 24px; font-size: 15px; color: #374151; line-height: 1.9;">{{if .ContactsSaved}}&#x2714; {{num .ContactsSaved}} contacts saved for you<br>{{end}}{{if .StatusesPosted}}&#x2714; {{num .StatusesPosted}} statuses posted, {{num .StatusViews}} views counted<br>{{end}}{{if .GroupSends}}&#x2714; {{num .GroupSends}} group blasts sent<br>{{end}}{{if .TimeSavedHours}}&#x2714; Roughly {{num .TimeSavedHours}} hours of manual work you did not do{{end}}</td>
      </tr>
    </table>
    {{else}}
    <p style="margin: 0 0 20px 0;">You've had WASBOT for a week. Whether you've used it a lot or a little, here's everything you need in one place.</p>
    {{end}}

    {{if .NeedsLink}}
    <p style="margin: 0 0 20px 0;">Not linked yet? Link your WhatsApp first, it takes about a minute: {{.ConnectURL}}</p>
    {{end}}

    <p style="margin: 0 0 20px 0;">Anytime you're stuck, <a href="https://wa.me/2349018943768?text=Hi%20Victor%2C%20I%20just%20joined%20WASBOT%20and%20need%20help." target="_blank" style="font-weight: 600;">message us on WhatsApp</a> and a representative will respond as soon as possible.</p>

    <p style="margin: 0 0 12px 0; color: #111827;"><strong>Videos worth keeping:</strong></p>

    <p style="margin: 0 0 20px 0;"><a href="https://www.wasbot.app/tutorials" target="_blank" style="font-weight: 600;">All tutorials, linking first</a><br><a href="https://www.wasbot.app/watch/contacts" target="_blank" style="font-weight: 600;">Contact saving (3 min)</a><br><a href="https://www.wasbot.app/watch/groups" target="_blank" style="font-weight: 600;">Send to all your groups (4 min)</a><br><a href="https://youtu.be/UbRkNE8muGY" target="_blank" style="font-weight: 600;">Follow-up sequences (15 min)</a></p>

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 24px;">
      <tr>
        <td style="padding: 16px 20px; font-size: 15px; color: #374151; line-height: 1.8;">Join the community, we share tips and updates there:<br><a href="{{if .WhatsAppGroupURL}}{{.WhatsAppGroupURL}}{{else}}https://chat.whatsapp.com/EoP7wlsiUe4CKKA5E6BXCY{{end}}" target="_blank" style="font-weight: 600;">WhatsApp group</a> &middot; <a href="https://whatsapp.com/channel/0029VbDZGfB17EmsMzdM8f31" target="_blank" style="font-weight: 600;">WhatsApp channel</a> &middot; <a href="https://instagram.com/wasbot.app" target="_blank" style="font-weight: 600;">Instagram</a> &middot; <a href="https://x.com/wasbot" target="_blank" style="font-weight: 600;">X</a> &middot; <a href="https://www.youtube.com/@wasbot_app" target="_blank" style="font-weight: 600;">YouTube</a></td>
      </tr>
    </table>

    <p style="margin: 32px 0 0 0; font-size: 16px; color: #374151; line-height: 1.7;">Talk soon,<br><strong>The WASBOT Team</strong></p>
                  </div>
                </td>
              </tr>

              <!-- Footer -->
              <tr>
                <td style="background-color: #f9fafb; padding: 0; border-radius: 0 0 16px 16px; border: 1px solid #e5e7eb; border-top: none;">
                  <div style="height: 1px; background: linear-gradient(to right, transparent, #e5e7eb, transparent); margin: 0 40px;"></div>

                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                    <tr>
                      <td class="footer-content" style="padding: 32px 40px; text-align: center;">
                        <p style="margin: 0 0 20px 0; font-size: 14px; color: #6b7280; line-height: 1.6;">
                          Need help? Simply reply to this email and we'll get back to you.
                        </p>

                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin-bottom: 20px;">
                          <tr>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialTwitter}}" style="display: inline-block;">
                                <img src="{{.Branding.IconTwitterURL}}" alt="X" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialInstagram}}" style="display: inline-block;">
                                <img src="{{.Branding.IconInstagramURL}}" alt="Instagram" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialYouTube}}" style="display: inline-block;">
                                <img src="{{.Branding.IconYouTubeURL}}" alt="YouTube" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                          </tr>
                        </table>

                        <p style="margin: 0; font-size: 13px; color: #9ca3af; line-height: 1.5;">
                          {{.Branding.CompanyName}} Technologies<br>
                          Lagos, Nigeria
                        </p>

                        <p style="margin: 16px 0 0 0; font-size: 12px; color: #9ca3af;">
                          &copy; {{.Branding.Year}} {{.Branding.CompanyName}}. All rights reserved.
                        </p>

                        {{if .UnsubscribeURL}}
                        <p style="margin: 12px 0 0 0; font-size: 12px; color: #9ca3af;">
                          <a href="{{.UnsubscribeURL}}" style="color: #9ca3af; text-decoration: underline;">Unsubscribe</a> from these emails.
                        </p>
                        {{end}}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
          </td>
        </tr>
      </table>
    </body>
    </html>

