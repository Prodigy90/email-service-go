                    <p style="margin: 0 0 20px 0;">If you have moved on from WASBOT, I completely understand, and thank you for supporting me back when I was still figuring things out.</p>

                    <p style="margin: 0;">Talk soon,<br><strong>Victor</strong></p>
                  </div>
