legacy_winback_a3:
  subject: "₦5,600 a month, and the real cost of keeping your phone online"
  preview_text: "Why cheap automation always breaks when you need it most."
  body: |-
    Hi there,

    When WASBOT first launched, it was dirt cheap. It started out completely free, moved to ₦2,000, and eventually settled at ₦3,000 a month.

    I wanted everyone to have access to automation while I gathered feedback to build a solid product.

    At that point, WASBOT made me zero Naira, and I was paying extra server costs straight out of my own pocket.

    But that low price came with a major catch: everyone was crammed onto one single server. As WASBOT grew to hundreds of marketers & TVs, upgrading servers every single week became completely unmaintainable.

    If your campaign happened to align with another marketer sending to 500 groups, your messages had to wait in line. If an account with 50,000 contacts tried to post a status, everyone else sat frozen until it finished.

    When you had an 8 PM class, your messages went out hours late, contacts stopped saving midway, and sessions logged out.

    You were paying very little, but losing real money on delayed sales.

    Today, Basic on the new WASBOT is ₦8,000 a month. I will not pretend that is not a jump.

    Instead of squeezing everyone together, every account now runs on its own dedicated cloud machine. It stays online day and night, whether your phone is on, off, or dead in your bag. That costs real money to run, but it guarantees your business never stalls.

    Because you stood by me during those early days, your Legacy Believer rate gives you a permanent 30% discount across every plan for life:

    * Basic (₦8,000/mo) ➔ ₦5,600/mo (Save ₦28,800/yr)
    * Premium (₦20,000/mo) ➔ ₦14,000/mo (Save ₦72,000/yr)
    * Pro (₦50,000/mo) ➔ ₦35,000/mo (Save ₦180,000/yr)

