# Legacy winback Set A — wasbot.ng paying customers who never signed up on wasbot.app.
# Copy is the FOUNDER'S OWN (docs/templates/legacy-winback-emails-2026-08.md, "My Version",
# fact-checked 2026-08-19). A2-A4 will land here after the founder's story rework.
#
# Vars per recipient (from the campaign CSV, no defaults on purpose — a missing field
# must fail the send, not mail a blank): OldPlan ("Ultimate Organizer"), OldAmount
# (pre-formatted, "₦20,000"), OldPeriod (month/quarter/year), FreeDays (7/14/30).
# Set A deliberately opens "Hi there," — old records don't carry clean first names.
# UnsubscribeURL is auto-injected by the email service.

legacy_winback_a1:
  subject: "We rebuilt WASBOT because you deserved better"
  preview_text: "Your {{.FreeDays}} free days are sitting on your old email address."
  body: |-
    Hi there,

    Back when WASBOT was still wasbot.ng, you didn't just use the platform, you believed in it. You paid {{.OldAmount}} for {{.OldPlan}}, a whole {{.OldPeriod}} of it, trusting our vision while the system was actively making your day harder.

    You endured it: group messages stalling, status queues failing, contacts stopping midway, and sessions logging out out of nowhere.

    That was unacceptable. Your patience is the reason we scrapped the old codebase completely and rebuilt WASBOT from the ground up so none of that could ever happen again.

    The new platform at wasbot.app is built strictly for high performance:

    * Dedicated Resources: Every account gets its own isolated server. No queueing behind other users, no freezing.
    * Instant Delivery: Statuses, broadcasts, and group messages go out in seconds, whether your phone is on, off, or dead in your bag.
    * Real-Time Contact Saving: Instant saving with zero drop-offs.
    * Scaled Stability: Our largest accounts now post to 47,000+ contacts in a single run with live view and delivery tracking.

    Beyond statuses, WASBOT now runs completely on autopilot. You can schedule your content ahead of time, auto-delete posts, track viewers live, broadcast to DMs and groups, run multiple WhatsApp numbers at once, and set up automatic AI replies for incoming messages. Set it up once, step away, and let it handle the rest.

    Because you stood by us early on, I want you back to test the new system:

    We've credited your account with {{.FreeDays}} days on our Basic Plan, completely free, no credit card required. Your days only start counting from the moment you sign up, so nothing is wasted while you decide when to start.

    ⚠️ Crucial: You MUST sign up with THIS SAME EMAIL ADDRESS so the system can match your old account and credit your free days automatically.

    To be transparent: WASBOT does not cost {{.OldAmount}} anymore. The old price only worked because everyone was crammed onto one weak server, which is why it kept failing. Today, running your own dedicated machine costs real money, but it's why the product actually works.

    Our standard plans today:
    * Basic (₦8,000/mo): Perfect for individual marketers starting out.
    * Premium (₦20,000/mo): Built for mid-tier WhatsApp TVs and growing businesses (our most popular tier).
    * Pro (₦50,000/mo): Built for top 10% WhatsApp TVs and high-volume marketers.

    As an original supporter, you get a permanent 30% discount ACROSS ALL PLANS for life as a Legacy Believer. That brings Basic to ₦5,600/mo, Premium to ₦14,000/mo, and Pro to ₦35,000/mo. No new user today can ever get this rate.

    When your free Basic days are up, you can simply renew your Basic plan at your discounted ₦5,600/mo rate, or upgrade to Premium/Pro with the same 30% discount applied automatically.

    Claim your free Basic plan and experience the new WASBOT: https://www.wasbot.app/signup

    Note: This invitation closes on August 31st. Sign up before then to claim your free days and lock in your Legacy Believer discount forever.

    Thank you for believing in us when we were still figuring things out. I'd love to welcome you back.

    Talk soon,
    Victor

    ---
    You're receiving this because you had a paid plan on wasbot.ng.
    Unsubscribe: {{.UnsubscribeURL}}
