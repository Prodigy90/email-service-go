                    <p style="margin: 0 0 20px 0;">Sign up before today ends to claim your <strong>{{.FreeDays}} free Basic days</strong> and lock in your Legacy Believer rate. That is <strong>30% off any plan for life</strong>, as long as you pay once before your free days finish.</p>

                    <p style="margin: 0 0 24px 0;">After tonight, both the free days and the permanent discount are off the table for good.</p>

                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 28px;">
                      <tr>
                        <td style="background-color: #fffbeb; border: 1px solid #f59e0b; border-radius: 8px; padding: 14px 16px;">
