          <td style="padding: 40px 20px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" align="center" class="container" style="max-width: 600px; margin: 0 auto;">

              <!-- Header -->
              <tr>
                <td class="header" style="background: linear-gradient(135deg, #111827 0%, #1f2937 100%); padding: 32px 40px; border-radius: 16px 16px 0 0;">
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td style="vertical-align: middle; padding-right: 14px;">
                        <div style="width: 44px; height: 44px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); border-radius: 12px; text-align: center; line-height: 44px;">
                          {{.Branding.LogoContent}}
                        </div>
                      </td>
                      <td style="vertical-align: middle;">
                        <span class="header-company-name" style="color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: 1px;">{{.Branding.CompanyName}}</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Body -->
              <tr>
                <td class="content" style="background-color: #ffffff; padding: 40px; border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;">
                  <div style="font-size: 16px; line-height: 1.7; color: #4b5563;">
                    <p style="margin: 0 0 20px 0;">Hi {{.Name}},</p>
                    <p style="margin: 0 0 20px 0;">Last one from us about this: we&rsquo;re closing out your signup discount.</p>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 28px;">
                      <tr>
                        <td style="background-color: #f0fdf4; border: 2px solid {{.Branding.PrimaryColor}}; border-radius: 12px; padding: 18px;">
                          <div style="color: #166534; font-weight: 800; font-size: 20px; margin-bottom: 4px;">&#8358;6,400 for your first month</div>
                          <div style="color: #166534; font-size: 14px;">of WASBOT Basic (then &#8358;8,000/month, and you can cancel anytime. Keep it only if it&rsquo;s earning its keep).</div>
                        </td>
                      </tr>
                    </table>
                    <p style="margin: 0 0 16px 0;">People think WASBOT is one big feature. It&rsquo;s not. It&rsquo;s the small things, running every day, that stack up:</p>
                    <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #4b5563;">
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Auto-save:</strong> every lead that DMs you is saved to your phone and Google, instantly.</td></tr>
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Cloud status:</strong> post once, your whole list gets it, saved or not. Phone stays cool.</td></tr>
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Who-viewed, by name:</strong> delivery and view numbers you can screenshot, instead of &ldquo;trust me.&rdquo;</td></tr>
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Group blast:</strong> every group in one tap: text, photos, videos.</td></tr>
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Group actions:</strong> approve join requests, export members, manage dozens of groups in one go.</td></tr>
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Scheduling:</strong> queue status posts and group sends; they go out while you&rsquo;re with customers.</td></tr>
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Broadcasts:</strong> DM campaigns straight to your contacts, no group needed.</td></tr>
    <tr><td style="padding: 0 10px 12px 0; vertical-align: top; color: {{.Branding.PrimaryColor}}; font-weight: 700;">&bull;</td><td style="padding: 0 0 12px 0;"><strong style="color: #1f2937;">Autoresponder:</strong> every new lead gets an instant reply, even at 2am.</td></tr>
    </table>
                    <p style="margin: 0 0 20px 0;">Each one hands you back minutes. Together they hand you back your day.</p>
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto 20px;">
                      <tr>
                        <td style="border-radius: 8px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);">
                          <a href="https://wasbot.app/checkout?tier=basic&amp;discount=WASBOT20" target="_blank" style="display: inline-block; padding: 16px 40px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none;">
                            Use your 20% before it goes
                          </a>
                        </td>
                      </tr>
                    </table>
                    <p style="margin: 0; font-size: 14px; color: #6b7280; text-align: center;">If WhatsApp isn&rsquo;t where your business runs, no wahala. This is the last email about this offer.</p>
                  </div>
                </td>
              </tr>

              <!-- Footer -->
              <tr>
                <td style="background-color: #f9fafb; padding: 0; border-radius: 0 0 16px 16px; border: 1px solid #e5e7eb; border-top: none;">
                  <div style="height: 1px; background: linear-gradient(to right, transparent, #e5e7eb, transparent); margin: 0 40px;"></div>
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                    <tr>
                      <td class="footer-content" style="padding: 32px 40px; text-align: center;">
                        <p style="margin: 0 0 20px 0; font-size: 14px; color: #6b7280; line-height: 1.6;">
                          Need help? Simply reply to this email and we'll get back to you.
                        </p>
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin-bottom: 20px;">
                          <tr>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialTwitter}}" style="display: inline-block;">
                                <img src="{{.Branding.IconTwitterURL}}" alt="X" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialInstagram}}" style="display: inline-block;">
                                <img src="{{.Branding.IconInstagramURL}}" alt="Instagram" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialYouTube}}" style="display: inline-block;">
                                <img src="{{.Branding.IconYouTubeURL}}" alt="YouTube" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                          </tr>
                        </table>
                        <p style="margin: 0; font-size: 13px; color: #9ca3af; line-height: 1.5;">
                          {{.Branding.CompanyName}} Technologies<br>Lagos, Nigeria
                        </p>
                        <p style="margin: 16px 0 0 0; font-size: 12px; color: #9ca3af;">
                          &copy; {{.Branding.Year}} {{.Branding.CompanyName}}. All rights reserved.
                        </p>
                        {{if .UnsubscribeURL}}
                        <p style="margin: 12px 0 0 0; font-size: 12px; color: #9ca3af;">
                          <a href="{{.UnsubscribeURL}}" style="color: #9ca3af; text-decoration: underline;">Unsubscribe</a> from these emails.
                        </p>
                        {{end}}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
          </td>
        </tr>
      </table>
    </body>
    </html>

