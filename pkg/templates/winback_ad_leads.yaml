# Win-back campaign — ad-origin leads who signed up but never paid (Ticket A)
# winback_ad_leads_d0, winback_ad_leads_d3, winback_ad_leads_d7
#
# Vars: Name (personalization only — set by campaign-service's Sender from the
# CSV name column, falls back to "there"). UnsubscribeURL is auto-injected by
# the email service. The checkout link is a single fixed URL for the whole
# campaign (tier=basic&discount=WASBOT20), so it's hardcoded directly in the
# copy rather than templated — campaign-service's Sender.sendBatch() only
# populates Name/PricingURL/RefParam/DashboardURL, and this campaign has no
# per-recipient CTA, so there was nothing to gain from wiring a new field.

