# Migration blast for 8.7k wasbot.ng legacy users
# New features announcement + sunset notice + wasbot.app signup CTA

migration_blast_apr2026:
  subject: "Here's what's new on WASBOT since we last spoke"
  preview_text: "Autoresponder, scheduled messages, multi-currency payments and more — all live on wasbot.app."
  description: "Migration follow-up for 8.7k wasbot.ng users — new features added since last email + sunset reminder"
  body: |-
    Hi {{.Name}},

    Quick update on what we've shipped since the last time we reached out —
    and a friendly reminder about the wasbot.ng sunset.

    -----------------------------------------------------------------------
    WHAT'S NEW SINCE OUR LAST EMAIL
    -----------------------------------------------------------------------

    AUTORESPONDER — AUTO-REPLY TO DMs
    Someone DMs "price"? WASBOT replies instantly. Set keyword triggers,
    multiple keywords per rule, smart cooldowns so you never spam anyone.
    Reply only to new/unsaved contacts (great for ad leads) or saved
    contacts only (for VIPs). Human-like typing delays included.

    SCHEDULED MESSAGES
    Schedule status posts and group messages for any time. Queue tomorrow's
    promo tonight at 2am and it goes out at 9am. Set your whole week on
    Sunday and focus on closing sales the rest of the week.

    GROUP COLLECTIONS
    Organize 100+ groups into named folders ("Sales Groups", "VIP Clients",
    "Hot Leads"). Select a folder and blast every group in it with one click.

    MULTI-CURRENCY PAYMENTS
    Pay in USD, GBP, GHS, KES, or ZAR via Flutterwave, or Naira via Paystack
    as always. Currency is auto-detected based on your location.

    DISCOUNT CODES AT CHECKOUT
    Apply discount codes at checkout for percentage or fixed-amount savings.

    ADDON SESSIONS
    Already on Premium but need another WhatsApp number? Add extra sessions
    on top of your plan — billed alongside your base subscription.

    -----------------------------------------------------------------------
    FRIENDLY REMINDER: WASBOT.NG SUNSET
    -----------------------------------------------------------------------
    - wasbot.ng stays active until July 2026
    - No new subscriptions can be made on wasbot.ng
    - If your current subscription expires, you won't be able to renew
    - All new features are on wasbot.app only

    -----------------------------------------------------------------------

    START FREE ON WASBOT.APP
    {{.SignupURL}}

    -----------------------------------------------------------------------

    JOIN THE WASBOT COMMUNITY ON WHATSAPP
    Get help, tips, and connect with other users.
    {{.WhatsAppGroupURL}}

    -----------------------------------------------------------------------

    Questions? Just reply to this email — we actually read them.

    — The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account.
    Unsubscribe: {{.UnsubscribeURL}}
  html_body: |-
