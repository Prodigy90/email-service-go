                  <div style="font-size: 16px; line-height: 1.7; color: #4b5563;">
    <p style="margin: 0 0 20px 0;">Hi {{.Name}},</p>

    <p style="margin: 0 0 24px 0;">Your 7 day free trial is on. Here's what <strong>WASBOT</strong> does for you starting now:</p>

