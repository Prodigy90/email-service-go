post_trial_unlinked:
  subject: Your trial ended — you never got to try it
  description: Post-trial step 0, never-linked variant. The shared copy claims 'everything you configured is still saved' — for this reader that is simply untrue.
  preview_text: Your account is still here. Linking is 60 seconds whenever you want it.
  body: |-
    Hi {{.Name}},

    Your WASBOT trial has ended. Being straight with you: you never linked a WhatsApp number, so you didn't actually get to use any of it.

    That's not much of a trial. So here's the honest version.

    The step that stops most people is the warning WhatsApp shows for pairing codes — "This may be a scam", naming a device in Montréal, Québec, Canada. That's our server. WASBOT runs your automations from the cloud, which is why your phone doesn't have to stay on. Tap the green "Link device" and you're in. Or pick "Scan QR Code" instead — WhatsApp doesn't warn on QR at all.

    Your account is still here. Nothing was deleted. If you link now you'll see in about a minute what the trial was meant to show you:

    - Every new DM saves itself to your contacts
    - Post once, your whole list sees it, phone stays cool
    - Every group messaged in one tap
    - DMs answered while you sleep

    Link your WhatsApp: {{.DashboardURL}}

    And if WASBOT just isn't for you, reply and tell us why — that's genuinely useful to us.

    — The WASBOT Team

    Join the WASBOT Community: {{.WhatsAppGroupURL}}
