stalled_no_session:
  subject: "You signed up for WASBOT — here's how to get started"
  description: "Stalled user: Signed up but never created a session. Guides them through first steps."
  body: |-
    Hi {{.Name}},

    You signed up for WASBOT but haven't set up your WhatsApp yet. Here's how to get started — it takes less than 2 minutes:

    1. Log in to your dashboard at {{.DashboardURL}}
    2. Click "Add Session" to create your WhatsApp session
    3. Enter your phone number (with country code, no + or spaces, e.g. 2348012345678), click Continue to get a pairing code
    4. Open WhatsApp → Linked Devices → Link a Device → Link with phone number → enter the code

    If you have another device, you can scan a QR code instead. Either method works.

    Note: WhatsApp may show a "This might be a scam" warning when linking — you can safely ignore it. It's a standard warning WhatsApp shows for all third-party tools.

    Here's what you'll unlock once connected:
    - Auto-save every new contact to Google Contacts
    - Post HD status to thousands of contacts in seconds
    - Auto-reply to DMs with keyword triggers
    - Send messages to 100+ groups at once

    Watch how it works: {{.VideoURL}}

