onboarding_day2:
  subject: "Post your status from the cloud, phone in your pocket"
  description: "Day 2: cloud status (quality, phone-free, view/delivery stats) + code one-liner. Trial lifecycle rebuild 2026-08."
  preview_text: "Post from the cloud. Full quality, phone stays in your pocket."
  body: |-
    Hi {{.Name}},

    You know the routine. Status takes forever to send, phone gets hot, WhatsApp lags, and half your contacts never even see it.

    WASBOT posts your status from the cloud. Upload once, it goes out in full quality, and your phone does nothing. You can post with your phone off.

    {{if .StatusesPosted}}You've posted {{.StatusesPosted}} statuses with WASBOT so far, reaching {{.StatusRecipients}} contacts.{{else}}You haven't posted one yet. Try it today. It takes a minute and you'll see the difference immediately.{{end}}

    And you get real numbers: delivered and viewed counts on every post, even for viewers who turned read receipts off.

    Post one now: {{if .StatusURL}}{{.StatusURL}}{{else}}{{.DashboardURL}}{{end}}

    {{if .Code}}Quick reminder: your code {{.Code}} is live for the rest of your trial. {{.CodePct}}% off your first month.

    {{end}}Talk soon,
    The WASBOT Team
  html_body: |-
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
