onboarding_day0:
  subject: "Welcome to WASBOT — here's what you just unlocked"
  description: "Day 0: Feature overview + connect CTA sent immediately after signup"
  body: |-
    Hi {{.Name}},

    Welcome to WASBOT! Don't sweat over what you can automate.

    Imagine never having to manually save a contact again. Never copy-pasting the same reply 50 times a day. Never hunched over your phone typing "price list" into every DM at 2am.

    We've done all the work for you. Automate everything — then open your phone only to oversee the results and close sales.

    This is what WASBOT gives you: your WhatsApp running itself while you focus on the business.

    Here's what's waiting for you:

    - Auto-Save Contacts: Every person who DMs you gets saved automatically to your Google Contacts with their WhatsApp name
    - Status Posting: Post HD status to 1,000+ contacts in seconds, not minutes — no phone heat, no compression
    - Group Messaging: Send to all your groups at once — no more copy-pasting
    - Autoresponder: Reply to DMs instantly, even while you sleep

    All you need to do is connect your WhatsApp to get started.

    Connect Your WhatsApp: {{.ConnectURL}}

    Your 7-day free trial starts now. Let's make the most of it.

    — The WASBOT Team

    PS — love WASBOT? You can earn commission when friends subscribe: https://affiliates.wasbot.app/signup

    Join the WASBOT Community: {{.WhatsAppGroupURL}}
