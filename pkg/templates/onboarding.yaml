# Trial onboarding email sequence (Days 0-7), unlinked Track A variants (U1-U7),
# post-trial re-engagement (Days 8-10), stalled session. Rebuilt per
# docs/templates/trial-lifecycle-rebuild-2026-08.md (2026-08-15).
# Templates: onboarding_day0 through day7, onboarding_unlinked_day1 through day7,
# post_trial_day8/9/10, stalled_session, onboarding_unlinked_mid/lastcall (DEPRECATED)

onboarding_day0:
  subject: "Welcome to WASBOT. Here's everything you just unlocked"
  description: "Day 0: instant, on signup. Full stack overview + link CTA + code introduced by name (trial lifecycle rebuild 2026-08)."
  preview_text: "Your 7 day free trial is on. Here's what starts working right now."
  body: |-
    Hi {{.Name}},

    Your 7 day free trial is on. Here's what WASBOT does for you starting now:

    - Posts your status from the cloud. Full quality, no lag, phone in your pocket.
    - Saves everyone who messages you straight to your contacts, automatically.
    - Messages all your groups at once instead of one by one.
    - Replies for you while you sleep, runs follow-up sequences, schedules posts, and shows you who actually sees your status.

    First step takes 60 seconds: link your WhatsApp. Scan one code and you're in.

    {{if .Code}}One more thing. There's a discount code with your name on it, {{.Code}}. It takes {{.CodePct}}% off your first month and it only works while your trial is running. More on that later.

    {{end}}Link your WhatsApp: {{.ConnectURL}}

    Talk soon,
    The WASBOT Team
  html_body: |-
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="color-scheme" content="light dark">
      <meta name="supported-color-schemes" content="light dark">
      <title>Welcome to WASBOT</title>
      <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
      <![endif]-->
      <style>
        :root { color-scheme: light dark; }

        /* Reset */
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }

        /* Client-specific */
        #outlook a { padding: 0; }
        .ReadMsgBody { width: 100%; }
        .ExternalClass { width: 100%; }
        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height: 100%; }

        /* Base styles */
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          background-color: #f3f4f6;
          margin: 0;
          padding: 0;
        }

        /* Links */
        a { color: {{.Branding.PrimaryColor}}; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Button styles */
        .btn {
          display: inline-block;
          padding: 14px 28px;
          background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%);
