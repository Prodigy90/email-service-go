stalled_session:
  subject: "About that \"This may be a scam\" warning"
  description: "Stalled session: user started linking and stopped. Assumes they hit WhatsApp's pairing-code security screen — the single biggest drop-off in activation — and answers it head-on. DEPRECATED - removed after backend cron switches to onboarding_unlinked_day*"
  preview_text: "It says Montréal because that's where our server runs. Here's the 60-second version."
  body: |-
    Hi {{.Name}},

    You started linking your WhatsApp and stopped. If you got as far as typing the code in, you probably saw this:

      "This may be a scam"
      Someone is trying to link a device in Montréal, Québec, Canada.

    That was us. Here's what's actually happening.

    WASBOT runs your automations from the cloud so your phone doesn't have to stay on — that's the entire point of it. Our server sits in Montréal. So when WhatsApp asks who this device in Canada is, it's describing our server, not a stranger.

    WhatsApp shows that warning for every pairing code, from every tool, every single time. Nobody can switch it off. We're naming the exact city and the exact button because only the people actually running the service can.

    When you see it, tap the green "Link device". That's the whole thing.

    Don't want to deal with the warning at all? Pick "Scan QR Code" instead — WhatsApp doesn't show it for QR.

    The full 60 seconds, either way:

    1. Open your dashboard and tap "Link your WhatsApp"
    2. Choose "Use Pairing Code", pick your country, then type your WhatsApp number
    3. In WhatsApp: Settings → Linked devices → Link a device → Link with phone number instead
    4. Type the code, then tap "Link device" when the warning comes up

    Still stuck? Reply to this email. A real person reads it and one word is enough.

    Getting started guide: {{.BlogURL}}

    Link your WhatsApp: {{.ConnectURL}}

    — The WASBOT Team

    Join the WASBOT Community: {{.WhatsAppGroupURL}}
