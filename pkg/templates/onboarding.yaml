winback_day12:
  subject: "Your WASBOT setup is still here — come back any time"
  description: "Winback: sent ~12 days after a paid subscription expires (Phase 5)"
  preview_text: "Your auto-save, group broadcasts, and cloud status are one click from running again."
  body: |-
    Hi {{.Name}},

    We noticed your WASBOT subscription wound down a couple of weeks ago — figured we'd reach out once before we let you get on with things.

    Your account, contacts, autoresponder rules, group collections, and status presets are all still here. The moment you renew, everything picks up exactly where you left off. No re-setup.

    Two things worth knowing if the timing's right:

    - Most users who come back say the reason wasn't the product — it was a quiet WhatsApp week. If that was you too, you're not alone.
    - If something specifically frustrated you, just reply to this email. A real person reads it, and we fix things off user feedback more often than you'd think.

    When you're ready to spin it back up: {{.PricingURL}}

    Either way, thanks for giving WASBOT a run.

    — The WASBOT Team
