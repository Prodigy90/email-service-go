  body: |-
    Hi {{.Name}},

    Ada is a course creator in Lekki who runs ads every week. But there was a big problem.

    Last week, 800 people DMed her. She only managed to reply to 560. The other 240? They just sat there at the bottom of her WhatsApp until she forgot about them. Once a message slides down, it's gone.

    By the time she remembered on Wednesday, a new set of messages had covered the old ones. By Monday, those leads were gone for good. That's 240 people who would have paid — but she lost them.

    Then she started using a simple system that automatically saves every new DM to her Google Contacts. No manual typing. No copy-paste.

    Two weeks in, her sales went up drastically. Closing an extra ₦600K a month — without spending an extra kobo on ads. She just stopped "dashing" leads to her competitors.

    Stop losing money on people who already DMed you.

    Connect your WhatsApp and save every lead automatically: {{.ConnectURL}}

    — The WASBOT Team

    PS — every contact you save today could be your next customer. That's the only number that matters.

    Join the WASBOT Community: {{.WhatsAppGroupURL}}
