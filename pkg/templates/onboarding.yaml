stalled_session:
  subject: "Need help connecting your WhatsApp to WASBOT?"
  description: "Stalled session: User created a session but hasn't connected"
  body: |-
    Hi {{.Name}},

    We noticed you created a session on WASBOT but haven't connected your WhatsApp yet.

    Is something blocking you? Reply to this email and let us know — even a one-word answer helps us make WASBOT better for everyone.

    Connecting takes less than 60 seconds. Here's how using the pairing code method (simplest):

    1. Go to your dashboard and click "Connect" on your session
    2. Enter your phone number (with country code, no + or spaces, e.g. 2348012345678), click Continue to get a pairing code
    3. Open WhatsApp → Linked Devices → Link a Device → Link with phone number → enter the code
    4. Done! WASBOT starts working immediately

    If you have another device, you can scan a QR code instead. Either method works.

    Note: WhatsApp may show a "This might be a scam" warning when linking — you can safely ignore it. It's a standard warning WhatsApp shows for all third-party tools.

    If you're running into any issues, just reply to this email — we'll help you personally. We've helped hundreds of users through this step, and we're happy to walk you through it.

    You can also check our getting started guide: {{.BlogURL}}

    Connect Now: {{.ConnectURL}}

    — The WASBOT Team

    Join the WASBOT Community: {{.WhatsAppGroupURL}}
