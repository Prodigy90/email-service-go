# Welcome and account-upgrade email templates
# welcome, account_upgraded
# trial_day3/5/6/10 and trial_expiring were removed 2026-08-15 (dead code:
# the old trial cron that called them is disabled; superseded by
# onboarding.yaml's onboarding_day0-7 / onboarding_unlinked_day1-7 sequence)

welcome:
  subject: "Welcome to {{.AppName}} - Your WhatsApp Automation Journey Starts Now!"
  body: |-
    Hi {{.Name}},

    Welcome to {{.AppName}}! We're thrilled to have you on board.

    You now have access to:
    - Broadcast status updates to up to 1,000 contacts
    - Auto-save new contacts to Google Contacts
    - Send messages to multiple groups + tag members
    - Post up to 5 status updates per day

    Here's how to get started:
    1. Connect your WhatsApp by scanning the QR code
    2. Link your Google account for contact sync
    3. Create your first status broadcast

    Your 7-day trial starts now. Make the most of it!

    Best,
    The {{.AppName}} Team
  html_body: |-
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="color-scheme" content="light dark">
      <meta name="supported-color-schemes" content="light dark">
      <title>Welcome!</title>
      <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
      <![endif]-->
      <style>
        :root { color-scheme: light dark; }

        /* Reset */
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }

        /* Client-specific */
        #outlook a { padding: 0; }
        .ReadMsgBody { width: 100%; }
        .ExternalClass { width: 100%; }
        .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height: 100%; }

        /* Base styles */
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          background-color: #f3f4f6;
          margin: 0;
          padding: 0;
        }

        /* Links */
        a { color: {{.Branding.PrimaryColor}}; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Button styles */
        .btn {
          display: inline-block;
          padding: 14px 28px;
          background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%);
          color: #ffffff !important;
          text-decoration: none;
          border-radius: 8px;
          font-weight: 600;
          font-size: 15px;
          box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
          transition: all 0.2s ease;
        }
        .btn:hover {
          background: linear-gradient(135deg, {{.Branding.SecondaryColor}} 0%, {{.Branding.AccentColor}} 100%);
          box-shadow: 0 6px 20px 0 rgba(16, 185, 129, 0.5);
        }
        .btn-danger {
          background: linear-gradient(135deg, {{.Branding.DangerColor}} 0%, #dc2626 100%);
          box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.39);
        }

        /* Responsive */
        @media only screen and (max-width: 620px) {
          .container { width: 100% !important; padding: 0 !important; }
          .content { padding: 24px 20px !important; }
          .header { padding: 24px 20px !important; }
          .footer-content { padding: 24px 20px !important; }
        }

        /* Dark mode — preserve header text visibility */
        @media (prefers-color-scheme: dark) {
          .header-company-name { color: #ffffff !important; }
        }
      </style>
