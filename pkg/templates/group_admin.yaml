# Group Admin launch announcement (June 2026)
# group_admin_launch — existing-user announcement: groups now have a back office (requests, CSV export, bulk admin)

group_admin_launch:
  subject: "Your WhatsApp groups now run themselves 🛠️"
  preview_text: "Approve join requests by name, export any group to a CSV you own, and promote, mute, archive or leave across dozens of groups at once."
  body: |
    Hi {{.Name}},

    Quick one — if you run WhatsApp groups, this is for you.

    You already use WASBOT to message all your groups in one click. But the admin
    work behind those groups still ate your day: tapping Approve, Approve, Approve
    on join requests, screenshotting member lists for advertisers, making one
    person admin in 18 groups one at a time.

    That's done now. The Groups page runs the admin side too:

      - Approve or reject join requests — you see each person's name and number,
        or hit "Approve all" to fill every open slot at once
      - Export any group's members (or its pending requests) to a CSV you own —
        names and numbers, ready to import and reach on status and broadcasts
      - Promote or demote a moderator across all your admin groups in one pass
      - Mute, archive, or leave dozens of groups at once — in the background,
        paced so WhatsApp doesn't flag you for moving too fast

    Here's the one marketers love: a 300-member group is 300 leads. Export them,
    import them into WASBOT, and now they can see your status and get your
    broadcasts — not just your group posts. That's owning your audience instead
    of renting it.

    Run it now: https://www.wasbot.app/groups
    See exactly how it works: https://www.wasbot.app/blog/group-admin

    It's on every plan, including the free trial. Only the daily message limits
    change by plan.

    What's coming next
    A single Group Requests inbox — every group you admin, with its pending
    count, in one place — plus adding members to a group straight from a CSV.

    Tell us what to build
    What's working? What's missing? What group chore do you wish WASBOT could
    take off your hands?
      - Join the community: https://chat.whatsapp.com/EoP7wlsiUe4CKKA5E6BXCY?mode=gi_t
      - Or just reply to this email — it comes straight to us.

    We read everything — and a lot of what we ship comes straight from these.

    Talk soon,
    The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account.
    Unsubscribe: {{.UnsubscribeURL}}
