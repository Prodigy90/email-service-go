# Group Admin launch announcement (June 2026)
# group_admin_launch — existing-user announcement: groups now have a back office (requests, CSV export, bulk admin)

group_admin_launch:
  subject: "Your Groups page now handles the admin side too"
  preview_text: "Bulk-approve join requests, export any group's members to a CSV you own, and mute, archive or leave dozens of groups at once."
  body: |
    Hi {{.Name}},

    If you run WhatsApp groups, the messaging was never the hard part — WASBOT
    already posts to all your groups in one go. The hard part is everything
    around them: approving join requests one tap at a time, pulling member lists
    by hand, making someone an admin in each group separately, and hunting
    through your chats to mute or leave the ones that have gone quiet.

    The Groups page handles that side now. Every group you admin is already
    listed there — so the management you used to do group-by-group on your phone,
    you can now do across all of them at once, from one screen.

    What you can do now:

      - Approve or reject join requests in one click. See who's asking by name
        and number, and approve them all at once to fill open slots and keep your
        groups full — instead of tapping through requests one after another.

      - Export any admin group's members to a CSV you own. A clean backup of
        every contact in the group — names and numbers — that stays yours, no
        matter what happens to the group later.

      - Promote a moderator into several groups at once. Hand someone you trust
        the keys across all your groups in one pass, so the groups keep running
        and you don't lose access if your main number ever gets banned.

      - Mute, archive, or leave groups in bulk. WASBOT already lists all your
        groups — select the ones you want and act on all of them at once, instead
        of digging through your chats one by one. The actions run in the
        background, spaced out rather than fired off all at once.

    Then the part worth thinking about:

    Those exported members don't have to stay a spreadsheet. Turn them into a
    status audience — a custom list built from your group contacts — and your
    status updates reach them directly, not just the posts you make inside the
    group. That's how you promote your next class, drop, or offer to the people
    who already showed up for it. One honest caveat: a contact only sees your
    status if they've saved your number, so this works best with an audience that
    already knows you. Used right, it's a real edge.

    Open your Groups page: https://www.wasbot.app/groups
    See exactly how it works: https://www.wasbot.app/blog/group-admin

    Tell us what to build
    What's working? What's missing? What group chore do you wish WASBOT could
    take off your hands?
      - Join the community: https://chat.whatsapp.com/EoP7wlsiUe4CKKA5E6BXCY?mode=gi_t
      - Or just reply to this email — it comes straight to us.

    We read everything, and a lot of what we ship starts right here.

    Talk soon,
    The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account.
    Unsubscribe: {{.UnsubscribeURL}}
