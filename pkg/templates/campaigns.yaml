sequences_followup_launch:
  subject: "Your Sequences now follow up for you"
  preview_text: "Set the wait, set the nudge, and Sequences follows up on its own when someone goes quiet."
  body: |
    Hi {{.Name}},

    The follow-up you've been doing by hand, WASBOT does now. Add a wait-for-reply step to any Sequence, and if the contact doesn't answer in the time you set, WASBOT sends your follow-up automatically. No going back through chats to see who went quiet.

    IT FOLLOWS UP ON ITS OWN
    A lead reads your message and goes silent. Set a follow-up window on the wait step, and when the time runs out with no reply, WASBOT nudges them for you. Still nothing? It tries again, up to a limit you set.

    IT RE-ASKS
    If someone replies with something that doesn't match what you asked, the flow can loop them back to the question instead of dead-ending. It keeps trying to get the answer you actually need.

    IT READS MORE THAN ONE WORD
    A single reply path can catch several keywords at once. "Yes", "sure", and "oya" can all take the same branch, so you are not building a separate option for every word your customers use.

    IT KNOWS WHEN TO STOP
    You set how many nudges a contact can get. After that the flow lets them go instead of nudging forever, so nobody gets five "you there?" messages in a row.

    Build your follow-up flow: https://www.wasbot.app/sequences

    Set it once and the follow-up runs itself, while you're doing literally anything else.

    Talk soon,
    The WASBOT Team

