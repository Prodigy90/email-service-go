status_viewer_names_launch:
  subject: "See who's actually watching your status (names, not numbers)"
  preview_text: "Tap any status and see exactly who watched it, plus who your top viewers are this month."
  body: |
    Hi {{.Name}},

    You've been able to see how many people viewed your status. Now you can see who.

    NAMES ON EVERY VIEW
    A number told you 126 people watched. It never told you which 126. Tap the delivered or viewed count on any status and the Status audience list opens: every contact by name, with the exact time they got it or watched it. Search a long list by name or number.

    TOP VIEWERS, RANKED
    The new Top Viewers panel ranks your most engaged contacts every month and shows how many of that month's posts each one watched, like "viewed 22 of 24". For a WhatsApp TV, that list is your advertisers in waiting.

    NUMBERS STAY PRIVATE
    Phone numbers stay masked by default. Names lead, and a number only shows in full when you tap to reveal it. This is about knowing who is engaged, not exposing anyone.

    Also new this drop: Sequences analytics now show contact names and WhatsApp-style read ticks; status deletion is on every plan, including trial; and your saved contacts now sync as named contacts inside WhatsApp itself, not just Google.

    See who's watching: https://www.wasbot.app/status

    Post your next status, then tap the numbers.

    Talk soon,
    The WASBOT Team

