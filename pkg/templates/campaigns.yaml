        body { margin: 0 !important; padding: 0 !important; width: 100% !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6; }
        a { color: {{.Branding.PrimaryColor}}; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media only screen and (max-width: 620px) {
          .container { width: 100% !important; padding: 0 !important; }
          .content { padding: 24px 20px !important; }
          .header { padding: 24px 20px !important; }
          .footer-content { padding: 24px 20px !important; }
          .plan-cards td { display: block !important; width: 100% !important; padding: 0 0 16px 0 !important; }
        }
        @media (prefers-color-scheme: dark) {
          .header-company-name { color: #ffffff !important; }
        }
      </style>
    </head>
    <body style="background-color: #f3f4f6; margin: 0; padding: 0;">
      <div style="display: none; max-height: 0; overflow: hidden;">
        We upgraded your plan limits — up to 15x more group messages and status reach, at no extra cost.
        &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
      </div>
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f3f4f6;">
        <tr>
          <td style="padding: 40px 20px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" align="center" class="container" style="max-width: 600px; margin: 0 auto;">

              <!-- Header -->
              <tr>
                <td class="header" style="background: linear-gradient(135deg, #111827 0%, #1f2937 100%); padding: 32px 40px; border-radius: 16px 16px 0 0;">
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td style="vertical-align: middle; padding-right: 14px;">
                        <div style="width: 44px; height: 44px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); border-radius: 12px; text-align: center; line-height: 44px;">
                          {{.Branding.LogoContent}}
                        </div>
                      </td>
                      <td style="vertical-align: middle;">
                        <span class="header-company-name" style="color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: 1px;">{{.Branding.CompanyName}}</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Body -->
              <tr>
                <td class="content" style="background-color: #ffffff; padding: 40px; border-left: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;">
                  <h1 style="margin: 0 0 24px 0; font-size: 26px; font-weight: 700; color: #111827; line-height: 1.3;">Your plan just got more powerful</h1>

                  <div style="font-size: 16px; line-height: 1.7; color: #4b5563;">
                    <p style="margin: 0 0 20px 0;">Hi {{.Name}},</p>
                    <p style="margin: 0 0 24px 0;">We've upgraded the limits on all WASBOT plans. If you're already subscribed, your new limits are <strong>already active</strong> &mdash; no action needed.</p>

                    <!-- Basic Plan Card -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 16px;">
                      <tr>
                        <td style="background-color: #f0fdf4; border-left: 4px solid #22c55e; padding: 20px; border-radius: 0 12px 12px 0;">
                          <h3 style="margin: 0 0 12px; color: #166534; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Basic &mdash; &#8358;8,000/mo</h3>
                          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                            <tr>
                              <td style="padding: 4px 0; font-size: 14px; color: #374151;">Saved contacts</td>
                              <td style="padding: 4px 0; font-size: 14px; color: #9ca3af; text-decoration: line-through; text-align: right; width: 60px;">2,500</td>
                              <td style="padding: 4px 0 4px 8px; font-size: 14px; color: #166534; font-weight: 700; text-align: right; width: 70px;">5,000</td>
                            </tr>
                            <tr>
                              <td style="padding: 4px 0; font-size: 14px; color: #374151;">Status recipients</td>
                              <td style="padding: 4px 0; font-size: 14px; color: #9ca3af; text-decoration: line-through; text-align: right;">5,000</td>
                              <td style="padding: 4px 0 4px 8px; font-size: 14px; color: #166534; font-weight: 700; text-align: right;">10,000</td>
                            </tr>
                            <tr>
                              <td style="padding: 4px 0; font-size: 14px; color: #374151;">Group messages/day</td>
                              <td style="padding: 4px 0; font-size: 14px; color: #9ca3af; text-decoration: line-through; text-align: right;">50</td>
                              <td style="padding: 4px 0 4px 8px; font-size: 14px; color: #166534; font-weight: 700; text-align: right;">500</td>
                            </tr>
                            <tr>
                              <td style="padding: 4px 0; font-size: 14px; color: #374151;">Tagged messages/day</td>
                              <td style="padding: 4px 0; font-size: 14px; color: #9ca3af; text-decoration: line-through; text-align: right;">25</td>
                              <td style="padding: 4px 0 4px 8px; font-size: 14px; color: #166534; font-weight: 700; text-align: right;">500</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>

                    <!-- Premium Plan Card -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 16px;">
                      <tr>
                        <td style="background-color: #eff6ff; border-left: 4px solid #3b82f6; padding: 20px; border-radius: 0 12px 12px 0;">
                          <h3 style="margin: 0 0 12px; color: #1d4ed8; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Premium &mdash; &#8358;20,000/mo</h3>
                          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                            <tr>
                              <td style="padding: 4px 0; font-size: 14px; color: #374151;">Saved contacts</td>
                              <td style="padding: 4px 0; font-size: 14px; color: #9ca3af; text-decoration: line-through; text-align: right; width: 60px;">10,000</td>
                              <td style="padding: 4px 0 4px 8px; font-size: 14px; color: #1d4ed8; font-weight: 700; text-align: right; width: 70px;">20,000</td>
                            </tr>
                            <tr>
                              <td style="padding: 4px 0; font-size: 14px; color: #374151;">Group messages/day</td>
                              <td style="padding: 4px 0; font-size: 14px; color: #9ca3af; text-decoration: line-through; text-align: right;">100</td>
                              <td style="padding: 4px 0 4px 8px; font-size: 14px; color: #1d4ed8; font-weight: 700; text-align: right;">1,500</td>
                            </tr>
                            <tr>
                              <td style="padding: 4px 0; font-size: 14px; color: #374151;">Tagged messages/day</td>
                              <td style="padding: 4px 0; font-size: 14px; color: #9ca3af; text-decoration: line-through; text-align: right;">100</td>
                              <td style="padding: 4px 0 4px 8px; font-size: 14px; color: #1d4ed8; font-weight: 700; text-align: right;">1,500</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>

                    <!-- Pro Plan Card -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                      <tr>
                        <td style="background-color: #faf5ff; border-left: 4px solid #a855f7; padding: 20px; border-radius: 0 12px 12px 0;">
                          <h3 style="margin: 0 0 8px; color: #7e22ce; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Pro &mdash; &#8358;50,000/mo</h3>
                          <p style="margin: 0; font-size: 14px; color: #374151; line-height: 1.5;">
                            Everything stays <strong>unlimited</strong>. Plus: <strong>tag groups you're not an admin of</strong> &mdash; coming soon.
                          </p>
                        </td>
                      </tr>
                    </table>

                    <p style="margin: 0 0 24px 0;">We looked at how you actually use WASBOT and realized the old limits were holding you back. If you were hitting the daily cap on group messages or couldn't reach enough contacts with status &mdash; that's fixed now.</p>

                    <!-- CTA -->
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto 28px;">
                      <tr>
                        <td style="border-radius: 8px; background: linear-gradient(135deg, {{.Branding.PrimaryColor}} 0%, {{.Branding.SecondaryColor}} 100%); box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);">
                          <a href="{{.DashboardURL}}" target="_blank" style="display: inline-block; padding: 16px 40px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none;">
                            Open Your Dashboard
                          </a>
                        </td>
                      </tr>
                    </table>

                    <p style="margin: 0 0 16px 0; font-size: 14px; color: #6b7280;">On the free trial? These limits apply when you upgrade. <a href="{{.PricingURL}}" style="color: {{.Branding.PrimaryColor}}; font-weight: 600;">See the plans &rarr;</a></p>

                    <p style="margin: 0;">Talk soon,<br><strong>The WASBOT Team</strong></p>
                  </div>
                </td>
              </tr>

              <!-- Footer -->
              <tr>
                <td style="background-color: #f9fafb; padding: 0; border-radius: 0 0 16px 16px; border: 1px solid #e5e7eb; border-top: none;">
                  <div style="height: 1px; background: linear-gradient(to right, transparent, #e5e7eb, transparent); margin: 0 40px;"></div>
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                    <tr>
                      <td class="footer-content" style="padding: 32px 40px; text-align: center;">
                        <p style="margin: 0 0 20px 0; font-size: 14px; color: #6b7280; line-height: 1.6;">
                          Need help? Simply reply to this email and we'll get back to you.
                        </p>
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin-bottom: 20px;">
                          <tr>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialTwitter}}" style="display: inline-block;">
                                <img src="{{.Branding.IconTwitterURL}}" alt="X" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialInstagram}}" style="display: inline-block;">
                                <img src="{{.Branding.IconInstagramURL}}" alt="Instagram" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                            <td style="padding: 0 8px;">
                              <a href="{{.Branding.SocialYouTube}}" style="display: inline-block;">
                                <img src="{{.Branding.IconYouTubeURL}}" alt="YouTube" width="24" height="24" style="opacity: 0.6;">
                              </a>
                            </td>
                          </tr>
                        </table>
                        <p style="margin: 0; font-size: 13px; color: #9ca3af; line-height: 1.5;">
                          {{.Branding.CompanyName}} Technologies<br>Lagos, Nigeria
                        </p>
                        <p style="margin: 16px 0 0 0; font-size: 12px; color: #9ca3af;">
                          &copy; {{.Branding.Year}} {{.Branding.CompanyName}}. All rights reserved.
                        </p>
                        {{if .UnsubscribeURL}}
                        <p style="margin: 12px 0 0 0; font-size: 12px; color: #9ca3af;">
                          <a href="{{.UnsubscribeURL}}" style="color: #9ca3af; text-decoration: underline;">Unsubscribe</a> from these emails.
                        </p>
                        {{end}}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
          </td>
        </tr>
      </table>
    </body>
    </html>
  description: "Limits upgrade announcement — send to all users to announce increased tier limits (saved contacts 2x, Basic 2x reach, Premium 5x group/tag messages)"
