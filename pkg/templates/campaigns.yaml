broadcasts_launch:
  subject: "New: send one DM campaign to your whole saved list"
  body: |
    Hi {{.Name}},

    Big one just dropped — Broadcasts. It's live on every plan, including the trial.

    Here's the thing it kills: copy-pasting the same message to 200 people one at a time. Or using WhatsApp's own broadcast that stops at 256 contacts and treats everyone the same.

    WHAT IT DOES
    Pick a list. Write your message — or a short chain of up to 5 messages. Hit start. WASBOT sends to your whole saved list slowly and safely, drops in each person's first name automatically, and stops sending to anyone who replies STOP.

    Each person gets it privately in their own chat. Their replies land in your normal inbox.

    SENT SLOWLY, ON PURPOSE
    It sends one message at a time with small random gaps, so the timing looks like a real person typing — not a machine. New numbers go even slower until they warm up. You can stop the whole campaign yourself any time.

    EVERY PLAN, INCLUDING TRIAL
    - Trial / Free: up to 2,000 recipients per campaign, 8 campaigns a day, with a small www.wasbot.app footer on the messages.
    - Paid plans: bigger caps (10,000 → 35,000 → unlimited) and no footer.

    The trial is a real taste. Paid lifts the caps and drops the footer.

    ONE THING — USE IT RESPONSIBLY
    Sending DMs to a lot of people carries a real risk of WhatsApp restricting your number. Only message people who already know you, keep your account warm, and start small. Never blast cold strangers.

    Try it now:
    {{.DashboardURL}}

    Or read the full guide first:
    https://www.wasbot.app/blog/broadcasts

    Talk soon,
    The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account.
    Unsubscribe: {{.UnsubscribeURL}}
