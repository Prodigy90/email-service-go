    YOUR PLATFORM VERDICT
    Status stats compares your monthly views against every WASBOT account and tells you where you stand, like "Top 8% of WASBOT this month". That is a line you can screenshot for advertisers. Aggregate only: nobody ever sees anybody else's numbers.

    THE MONTH-END WRAP
    On the 1st of each month WASBOT DMs you your month: total views, your verdict, group sends, and who watched the most. No remembering to check.

    ANY PERIOD YOU WANT
    7 days to 12 months in one tap, or open the picker for named periods and an exact calendar range. Every number on the page follows the range you pick. Days with no sends show a gap, not a fake zero, so your rates never lie.

    Look for the gold crown View stats button at the top of every page.

    See your numbers: https://www.wasbot.app/status/stats

    Post something today, then watch the chart move.

