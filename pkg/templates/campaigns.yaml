wasbot_ng_final_notice:
  subject: "Important: wasbot.ng is no longer accepting payments"
  body: |
    Hi {{.Name}},

    This is a final update about wasbot.ng.

    Starting now, wasbot.ng is no longer accepting new payments or subscription renewals. If you have an active subscription, it will continue working until it expires — nothing changes for you until then.

    But once your current subscription ends, wasbot.ng will not renew it. The platform stays online until July 2026, but only for existing active subscriptions to run out.

    WHAT THIS MEANS FOR YOU
    - Your current wasbot.ng subscription continues until it expires
    - No new charges will be made on wasbot.ng
    - When your subscription ends, move to wasbot.app
    - wasbot.ng stays accessible until July 2026 for active users

    YOUR NEW HOME: WASBOT.APP
    Everything you used on wasbot.ng is available on wasbot.app — plus features the old platform never had:

    SCHEDULED MESSAGES — Set the time, WASBOT sends it. Status posts, group messages, tagged messages — schedule once, it runs automatically.

    CLOUD POSTING — Post to WhatsApp status directly from your browser. No phone needed, no overheating, full HD quality.

    SMART DELIVERY — Sends your status in phases to build trust with WhatsApp. No more bans from posting to thousands of contacts at once.

    Plus: HD media, cross-posting across multiple sessions, group collections, status view tracking, and more.

    HOW TO MOVE (2 MINUTES)
    1. Go to https://www.wasbot.app
    2. Sign up with your email
    3. Connect your WhatsApp — scan QR and you're live

    Set up your account now: {{.DashboardURL}}

    Don't wait until your subscription expires. Move now and you'll be ready when the time comes.

    Questions? Just reply to this email.

    — The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account on wasbot.ng.
    Unsubscribe: {{.UnsubscribeURL}}
