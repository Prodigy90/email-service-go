product_update_march:
  subject: "WASBOT just got smarter — Smart Delivery, status views, and bigger limits"
  body: |
    Hi {{.Name}},

    Big updates this month. Here's everything new on WASBOT:

    1. BIGGER LIMITS — NO EXTRA COST
    We upgraded group and tagged message limits across all paid plans:
    - Basic: 50 → 500 group messages/day, 25 → 500 tagged messages/day
    - Premium: 100 → 1,500 group messages/day, 100 → 1,500 tagged messages/day
    - Pro: Still unlimited
    If you were hitting your daily cap — that's fixed now. Your new limits are already active.

    2. STATUS VIEW TRACKING (NEW)
    You post status but you have no idea who actually saw it. WhatsApp shows you views on your phone, but when you're posting from the cloud — nothing.
    Now WASBOT tracks sent, delivered, and viewed counts for every status post — even if read receipts are turned off. You'll see exactly what percentage of your audience is active.
    Read more: https://www.wasbot.app/blog/status-view-tracking

    3. SMART DELIVERY (NEW)
    You imported 10K contacts, posted one status, and WhatsApp flagged your account. Sound familiar? That's because WhatsApp doesn't trust accounts that suddenly blast thousands of people.
    Smart Delivery fixes this. It gradually sends your status in phases — building your trust score over a few days instead of triggering spam detection. You turn it on, WASBOT handles the pacing. No bans, full delivery.
    Read more: https://www.wasbot.app/blog/smart-delivery

    These features are live right now:
    {{.DashboardURL}}

    More coming. Go try these first.

    Talk soon,
    The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account.
