feature_announcement_v2:
  subject: "4 new features on WASBOT — ban protection, view tracking, billing & more"
  body: |
    Hi {{.Name}},

    Round 2 — more updates just went live on WASBOT. Here's everything new:

    1. SMART DELIVERY (BAN PROTECTION)
    You import 10K contacts, post one status, and WhatsApp bans you. Sound familiar?
    Smart Delivery fixes this. It gradually sends your status in phases — 5,000 contacts per post — and increases the volume over 2-3 weeks as your account builds trust. Includes daily post limits, cooldown timers, and contact rotation so every contact eventually sees your status.
    Enable it from your Status page.
    Read more: https://www.wasbot.app/blog/smart-delivery

    2. STATUS VIEW & DELIVERY TRACKING
    You post status to 20,000 contacts. How many actually received it? How many viewed it? Before, you had no idea.
    Now WASBOT tracks sent, delivered, and viewed counts for every status — in real-time. Even works when read receipts are off. Hover on any status to see delivery and view rate percentages.
    Perfect for WhatsApp TV operators showing advertisers real numbers instead of guesses.
    Read more: https://www.wasbot.app/blog/status-view-tracking

    3. GROUP & TAG LIMITS INCREASED
    Basic: 500 group messages and 500 tag messages per day (was 5).
    Premium: 1,500 each (was 10).
    Pro and Enterprise: Still unlimited.
    If you were hitting limits before — check again. Already active on your account.

    4. BILLING SYSTEM — CARD PAYMENTS, ADDONS & MULTI-CURRENCY
    Save your card and WASBOT handles renewals automatically. No more expired subscriptions because you forgot to pay.
    — Upgrade or downgrade anytime (pay only the difference for remaining days)
    — Buy addon sessions for more WhatsApp numbers on top of your plan
    — Apply discount codes at checkout
    — Pay in USD, GBP, GHS, KES, or ZAR via Flutterwave (Naira via Paystack as always)
    Read more: https://www.wasbot.app/blog/billing-guide

    Everything is live now. See the full changelog:
    https://www.wasbot.app/changelog

    Open your dashboard: {{.DashboardURL}}

    More updates coming. Go try these first.

    Talk soon,
    The WASBOT Team

    ---
    You're receiving this because you have a WASBOT account.
    Unsubscribe: {{.UnsubscribeURL}}
