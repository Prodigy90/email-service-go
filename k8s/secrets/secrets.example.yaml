apiVersion: v1
kind: Secret
metadata:
  name: email-service-secrets
  namespace: wasbot-e2e
  labels:
    app.kubernetes.io/name: email-service
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgres://postgres:your-password@host.docker.internal:5432/email_service?sslmode=disable"

  # Redis
  REDIS_URL: "redis://:your-redis-password@host.docker.internal:6379/2"

  # API Key (for authenticating requests to this service)
  API_KEY: "your-email-service-api-key"

  # Resend API Key (email provider)
  RESEND_API_KEY: "re_your_resend_api_key"

  # From address
  FROM_EMAIL: "noreply@yourdomain.com"
  FROM_NAME: "Your App Name"
