name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'k8s/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image name to lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${GITHUB_SHA::8}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "This image contains both API and Worker binaries:" >> $GITHUB_STEP_SUMMARY
          echo "- API: \`/app/api\` (default CMD)" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: \`/app/worker\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check if KUBECONFIG is configured
        id: check_kubeconfig
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::KUBECONFIG secret not configured - skipping deployment"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        if: steps.check_kubeconfig.outputs.configured == 'true'
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        if: steps.check_kubeconfig.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        if: steps.check_kubeconfig.outputs.configured == 'true'
        run: |
          echo "Deploying email-service to wasbot-prod..."
          kubectl -n wasbot-prod rollout restart deployment email-service
          kubectl -n wasbot-prod rollout status deployment email-service --timeout=180s

      - name: Rollback on failure
        if: failure() && steps.check_kubeconfig.outputs.configured == 'true'
        run: |
          echo "Deployment failed, rolling back..."
          kubectl -n wasbot-prod rollout undo deployment email-service
          kubectl -n wasbot-prod rollout status deployment email-service --timeout=60s
          exit 1

      - name: Notify Discord (Success)
        if: success() && steps.check_kubeconfig.outputs.configured == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "✅ email-service Deployed",
                  "description": "Successfully deployed to production",
                  "color": 5763719,
                  "fields": [
                    {"name": "Commit", "value": "`'"${GITHUB_SHA::8}"'`", "inline": true},
                    {"name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true}
                  ]
                }]
              }' \
              "$DISCORD_WEBHOOK"
          fi
        continue-on-error: true

      - name: Notify Discord (Failure)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "❌ email-service Deploy Failed",
                  "description": "Deployment failed and was rolled back",
                  "color": 15548997,
                  "fields": [
                    {"name": "Commit", "value": "`'"${GITHUB_SHA::8}"'`", "inline": true},
                    {"name": "Logs", "value": "[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
                  ]
                }]
              }' \
              "$DISCORD_WEBHOOK"
          fi
        continue-on-error: true

      - name: Deployment Summary
        if: steps.check_kubeconfig.outputs.configured == 'true'
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`wasbot-prod\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: \`email-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${GITHUB_SHA::8}\`" >> $GITHUB_STEP_SUMMARY
